services:
  nginx:
    image: nginx:1.27.2
    depends_on:
      - fixmystreet
    ports:
      - "8000:80"
    volumes:
      - ./conf/nginx.conf-docker:/etc/nginx/conf.d/default.conf
    networks:
      default:
        aliases:
          - nginx.svc
  fixmystreet:
    image: fixmystreets-gr:latest
    build:
      context: ./docker/greece
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      memcached:
        condition: service_started
    cgroup: host
    stop_signal: SIGRTMIN+3
    # Mail goes out through the host Postfix, which signs it (DKIM) and relays it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The real configuration (addresses, database password) is kept out of git: copy
      # conf/general.yml-docker to conf/general.yml-local and fill it in.
      - ./conf/general.yml-local:/var/www/fixmystreet/fixmystreet/conf/general.yml
      - ./locale/el_GR.UTF-8/LC_MESSAGES:/var/www/fixmystreet/fixmystreet/locale/el_GR.UTF-8/LC_MESSAGES:ro
      - ./perllib/FixMyStreet/Cobrand/Greece.pm:/var/www/fixmystreet/fixmystreet/perllib/FixMyStreet/Cobrand/Greece.pm:ro
      - ./perllib/FixMyStreet/Map/Greece.pm:/var/www/fixmystreet/fixmystreet/perllib/FixMyStreet/Map/Greece.pm:ro
      # Same as the image's, except that text without Latin lowercase letters (Greek) is no longer
      # taken for SHOUTING and lowercased (cleanup_text).
      - ./perllib/Utils.pm:/var/www/fixmystreet/fixmystreet/perllib/Utils.pm:ro
      # Same as the image's, except that the /reports category counts include only public reports
      # (hidden and private ones made them add up to more than the map showed).
      - ./perllib/FixMyStreet/Script/UpdateAllReports.pm:/var/www/fixmystreet/fixmystreet/perllib/FixMyStreet/Script/UpdateAllReports.pm:ro
      # 👍/👎 on reports (POST /greece/vote/<id>).
      - ./perllib/FixMyStreet/App/Controller/GreeceVote.pm:/var/www/fixmystreet/fixmystreet/perllib/FixMyStreet/App/Controller/GreeceVote.pm:ro
      # Photos are anonymised before they are stored (anonymiser service below); the police copies,
      # with plates readable, stay on their own volume until their report is sent.
      - ./perllib/FixMyStreet/PhotoStorage/Greece.pm:/var/www/fixmystreet/fixmystreet/perllib/FixMyStreet/PhotoStorage/Greece.pm:ro
      - ./perllib/FixMyStreet/App/Controller/GreecePhoto.pm:/var/www/fixmystreet/fixmystreet/perllib/FixMyStreet/App/Controller/GreecePhoto.pm:ro
      # Sign-in page with email and password together (POST /greece/auth).
      - ./perllib/FixMyStreet/App/Controller/GreeceAuth.pm:/var/www/fixmystreet/fixmystreet/perllib/FixMyStreet/App/Controller/GreeceAuth.pm:ro
      - ./perllib/FixMyStreet/App/Controller/GreeceSocial.pm:/var/www/fixmystreet/fixmystreet/perllib/FixMyStreet/App/Controller/GreeceSocial.pm:ro
      - fixmystreet-originals:/var/lib/fms-originals
      - ./templates/web/greece:/var/www/fixmystreet/fixmystreet/templates/web/greece
      - ./templates/email/greece:/var/www/fixmystreet/fixmystreet/templates/email/greece:ro
      - ./web/cobrands/greece:/var/www/fixmystreet/fixmystreet/web/cobrands/greece:ro
      # App icons of the installable web app (manifest theme icons are read from web/theme/<cobrand>).
      - ./web/theme/greece:/var/www/fixmystreet/fixmystreet/web/theme/greece:ro
      # SEO: served by Catalyst static from the image web root; edit in place (single-file mounts)
      - ./web/robots.txt:/var/www/fixmystreet/fixmystreet/web/robots.txt:ro
      - ./web/sitemap.xml:/var/www/fixmystreet/fixmystreet/web/sitemap.xml:ro
      # Uploaded photos (UPLOAD_DIR '../upload/') and the caches must outlive the container: without
      # these, recreating it lost every report's photo (2026-10-24). The photos are a plain folder on
      # the host (owned by uid 1000, fms in the container), to be seen and backed up from there; it must
      # exist beforehand, else the app does not start (rather than run on an empty folder).
      - type: bind
        source: ${FMS_UPLOAD_DIR:-/data/fms/uploads}
        target: /var/www/fixmystreet/upload
        bind:
          create_host_path: false
      - fixmystreet-cache:/var/www/fixmystreet/cache
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - type: tmpfs
        target: /run
        tmpfs:
          size: "104857600"
      - type: tmpfs
        target: /run/lock
        tmpfs:
          size: "104857600"
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      FMS_DB_HOST: 'postgres.svc'
      FMS_DB_PASS: "${FMS_DB_PASS:?set FMS_DB_PASS in .env}"
      FMS_DB_NAME: 'fixmystreet'
      FMS_DB_USER: 'fms'
      FMS_ROOT: '/var/www/fixmystreet/fixmystreet'
      SUPERUSER_EMAIL: "${FMS_SUPERUSER_EMAIL:?set FMS_SUPERUSER_EMAIL in .env}"
      SUPERUSER_PASSWORD: "${FMS_SUPERUSER_PASSWORD:?set FMS_SUPERUSER_PASSWORD in .env}"
    networks:
      default:
        aliases:
          - fixmystreet.svc
  postgres:
    build:
      dockerfile_inline: |
        FROM postgres:13.11
        RUN localedef -i en_GB -c -f UTF-8 -A /usr/share/locale/locale.alias en_GB.UTF-8
        ENV LANG=en_GB.utf8
    restart: always
    volumes:
      - fixmystreet-pgdata:/var/lib/postgresql/data/pgdata
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      PGDATA: '/var/lib/postgresql/data/pgdata'
    networks:
      default:
        aliases:
          - postgres.svc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  memcached:
    image: memcached:1.6.32
    restart: always
    networks:
      default:
        aliases:
          - memcached.svc
  # Blurs number plates and faces in every uploaded photo and reads the plates (docker/greece/anonymiser);
  # only the app talks to it.
  anonymiser:
    build: ./docker/greece/anonymiser
    image: fixmystreets-anonymiser:latest
    restart: unless-stopped
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      default:
        aliases:
          - anonymiser.svc
  # Municipality lookups answered locally where certain, else by global MapIt (docker/mapit-local);
  # FixMyStreet uses it through MAPIT_URL in conf/general.yml-local.
  mapit-local:
    build: ./docker/mapit-local
    image: fixmystreets-mapit-local:latest
    restart: unless-stopped
    mem_limit: 256m
    networks:
      default:
        aliases:
          - mapit-local.svc
  # Self-hosted map (docker/greece/tiles, data built by bin/greece/build-tiles.sh), proxied at /tiles/.
  tiles:
    image: maptiler/tileserver-gl:v5.6.0
    restart: always
    command: ["--config", "/data/config.json", "--public_url", "${TILES_PUBLIC_URL:-https://fixmystreets.gr/tiles/}"]
    volumes:
      - ./docker/greece/tiles/config.json:/data/config.json:ro
      - ./docker/greece/tiles/styles:/data/styles:ro
      - ${TILES_DIR:-/opt/tiles}/data:/data/data:ro
      - ${TILES_DIR:-/opt/tiles}/fonts:/data/fonts:ro
      - ${TILES_DIR:-/opt/tiles}/sprites:/data/sprites:ro
    networks:
      default:
        aliases:
          - tiles.svc

volumes:
  fixmystreet-pgdata:
  fixmystreet-cache:
  fixmystreet-originals:
