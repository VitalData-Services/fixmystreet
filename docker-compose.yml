services:
  nginx:
    image: nginx:1.27.2
    depends_on:
      - fixmystreet
    ports:
      - "8000:80"
    volumes:
      - ./conf/nginx.conf-docker:/etc/nginx/conf.d/default.conf
    networks:
      default:
        aliases:
          - nginx.svc
  fixmystreet:
    image: fixmystreets-gr:latest
    build:
      context: ./docker/greece
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      memcached:
        condition: service_started
    cgroup: host
    stop_signal: SIGRTMIN+3
    # Mail goes out through the host Postfix, which signs it (DKIM) and relays it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./conf/general.yml-docker:/var/www/fixmystreet/fixmystreet/conf/general.yml
      - ./locale/el_GR.UTF-8/LC_MESSAGES:/var/www/fixmystreet/fixmystreet/locale/el_GR.UTF-8/LC_MESSAGES:ro
      - ./perllib/FixMyStreet/Cobrand/Greece.pm:/var/www/fixmystreet/fixmystreet/perllib/FixMyStreet/Cobrand/Greece.pm:ro
      - ./perllib/FixMyStreet/Map/Greece.pm:/var/www/fixmystreet/fixmystreet/perllib/FixMyStreet/Map/Greece.pm:ro
      - ./templates/web/greece:/var/www/fixmystreet/fixmystreet/templates/web/greece
      - ./templates/email/greece:/var/www/fixmystreet/fixmystreet/templates/email/greece:ro
      - ./web/cobrands/greece:/var/www/fixmystreet/fixmystreet/web/cobrands/greece:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - type: tmpfs
        target: /run
        tmpfs:
          size: "104857600"
      - type: tmpfs
        target: /run/lock
        tmpfs:
          size: "104857600"
    environment:
      POSTGRES_PASSWORD: 'password'
      FMS_DB_HOST: 'postgres.svc'
      FMS_DB_PASS: 'fms'
      FMS_DB_NAME: 'fixmystreet'
      FMS_DB_USER: 'fms'
      FMS_ROOT: '/var/www/fixmystreet/fixmystreet'
      SUPERUSER_EMAIL: '<admin address>'
      SUPERUSER_PASSWORD: "${FMS_SUPERUSER_PASSWORD:?set FMS_SUPERUSER_PASSWORD in .env}"
    networks:
      default:
        aliases:
          - fixmystreet.svc
  postgres:
    build:
      dockerfile_inline: |
        FROM postgres:13.11
        RUN localedef -i en_GB -c -f UTF-8 -A /usr/share/locale/locale.alias en_GB.UTF-8
        ENV LANG=en_GB.utf8
    restart: always
    volumes:
      - fixmystreet-pgdata:/var/lib/postgresql/data/pgdata
    environment:
      POSTGRES_PASSWORD: 'password'
      PGDATA: '/var/lib/postgresql/data/pgdata'
    networks:
      default:
        aliases:
          - postgres.svc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  memcached:
    image: memcached:1.6.32
    restart: always
    networks:
      default:
        aliases:
          - memcached.svc
  # Self-hosted map (docker/greece/tiles, data built by bin/greece/build-tiles.sh), proxied at /tiles/.
  tiles:
    image: maptiler/tileserver-gl:v5.6.0
    restart: always
    command: ["--config", "/data/config.json", "--public_url", "${TILES_PUBLIC_URL:-https://fixmystreets.gr/tiles/}"]
    volumes:
      - ./docker/greece/tiles/config.json:/data/config.json:ro
      - ./docker/greece/tiles/styles:/data/styles:ro
      - ${TILES_DIR:-/opt/tiles}/data:/data/data:ro
      - ${TILES_DIR:-/opt/tiles}/fonts:/data/fonts:ro
      - ${TILES_DIR:-/opt/tiles}/sprites:/data/sprites:ro
    networks:
      default:
        aliases:
          - tiles.svc

volumes:
  fixmystreet-pgdata:
